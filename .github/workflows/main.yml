name: Build Quran Karim APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Bundle current reciter catalog
        run: |
          mkdir -p app/src/main/assets/site
          curl -fsSL --retry 3 --retry-all-errors "https://mp3quran.net/api/v3/reciters?language=ar" -o app/src/main/assets/site/reciters.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("app/src/main/assets/site/reciters.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          reciters = data.get("reciters") or []
          complete = 0
          for rec in reciters:
              for m in rec.get("moshaf") or []:
                  if int(m.get("surah_total") or 0) == 114:
                      nums = {int(x) for x in str(m.get("surah_list") or "").split(",") if str(x).strip().isdigit()}
                      if len(nums) == 114 and all(i in nums for i in range(1, 115)):
                          complete += 1
          print(f"Bundled {len(reciters)} readers; {complete} complete recitations.")
          if complete < 2:
              raise SystemExit("Reciter catalog validation failed: fewer than 2 complete recitations.")
          PY

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Show tool versions
        run: |
          java -version
          gradle --version
          adb version
          "$ANDROID_HOME/build-tools/36.0.0/aapt" version

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 30
          sha256sum "$APK"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Karim-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
