plugins { id 'com.android.application' }

android {
    namespace 'com.noormuslim.quran'
    compileSdk 36

    defaultConfig {
        applicationId 'com.noormuslim.quran'
        minSdk 23
        targetSdk 36
        versionCode 9
        versionName '1.6'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
